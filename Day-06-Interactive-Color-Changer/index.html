<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Color Changer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="top">
      <p class="head">Color Changer</p>
      <p class="subhead">Click on any color button to change the preview box color</p>
    </div>

    <div class="mid"></div>

    <div class="bottom">
      <p class="bott-head">Choose a Color</p>
      <div class="buttons">
        <div class="red">Red</div>
        <div class="green">Green</div>
        <div class="blue">Blue</div>
      </div>
    </div>

    <div class="line"></div>
    <p class="status">Current color : <span class="stat">None</span></p>
  </main>
  
  <script src="script.js"></script>
</body>
</html>
