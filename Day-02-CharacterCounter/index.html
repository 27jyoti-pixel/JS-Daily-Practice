<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Counter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="top">
      <h1>Live Character Counter</h1>
      <p class="text">Type something and see the character count in real-time</p>
    </div>

    <div class="mid">
      <textarea class="user-input" type="textbox" placeholder="Write something here..." maxlength="100"></textarea>
    </div>
    
    <div class="mid2">
      <div class="left"><p> <span class="count">0</span>/100 <br> characters</p></div>
      <div class="m"><p><span class="left-count">100</span><br>characters remaining</p></div>
      <div class="right">
        <div class="stat"></div>
        <p class="alertstat">You're good to go</p>
      </div>
    </div>

    <div class="bottom1">
      <button class="but">Clear</button>
      <div class="progress">
          <div class="progress-bar"></div>
      </div>
    </div>

    <div class="bottom">
      <p class="text">Tip : Maximum 100 characters allowed</p>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
